# Cloud Build CI/CD para el Agente ADK
# Uso: gcloud builds submit --config cloudbuild.yaml
#
# Variables requeridas (definir en Triggers o pasar con --substitutions):
#   _PROJECT_ID: tu proyecto GCP
#   _REGION: región de Cloud Run (ej: us-central1)
#   _SERVICE_NAME: nombre del servicio Cloud Run

substitutions:
  _PROJECT_ID: ${PROJECT_ID}
  _REGION: us-central1
  _SERVICE_NAME: llm-security-agent-adk
  _IMAGE: gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}

steps:
  # Paso 1: Build de la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}:${SHORT_SHA}'
      - '-t'
      - '${_IMAGE}:latest'
      - '.'

  # Paso 2: Push al Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    waitFor: ['build-image']
    args:
      - 'push'
      - '--all-tags'
      - '${_IMAGE}'

  # Paso 3: Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloudrun'
    waitFor: ['push-image']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_IMAGE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--concurrency=80'
      - '--timeout=60s'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}'
      - '--set-env-vars=GOOGLE_CLOUD_LOCATION=${_REGION}'
      - '--set-env-vars=GEMINI_MODEL=gemini-2.0-flash-001'

  # Paso 4: Mostrar URL del servicio
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-url'
    waitFor: ['deploy-cloudrun']
    entrypoint: bash
    args:
      - '-c'
      - |
        URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_REGION} \
          --format='value(status.url)')
        echo "✅ Servicio desplegado en: $URL"
        echo "   Health check: $URL/health"
        echo "   Chat endpoint: $URL/chat"

images:
  - '${_IMAGE}:${SHORT_SHA}'
  - '${_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
