apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-security-backend
  namespace: llm-lab
  labels:
    app: llm-security-backend
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-security-backend
  template:
    metadata:
      labels:
        app: llm-security-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: gcr.io/PROJECT_ID/llm-security-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: secret-key
            - name: OLLAMA_URL
              value: "http://ollama-service:11434"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: llm-lab
spec:
  selector:
    app: llm-security-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
