# ============================================================
# IMPORTANTE: Este archivo es una PLANTILLA.
# Los valores reales se generan con los comandos comentados abajo.
# NUNCA hacer commit de secretos reales en este archivo.
# En producción usar: Sealed Secrets, External Secrets Operator,
# o Google Secret Manager con CSI driver.
# ============================================================

# Cómo generar los valores en base64:
#   echo -n "mi-secreto-super-seguro" | base64
#
# Generar SECRET_KEY seguro:
#   python3 -c "import secrets; print(secrets.token_hex(32))" | base64

apiVersion: v1
kind: Secret
metadata:
  name: llm-secrets
  namespace: llm-lab
  annotations:
    # En producción: referenciar desde Google Secret Manager
    # secret-manager.google.com/secret: "projects/MY_PROJECT/secrets/llm-secret-key"
    description: "Secretos para la aplicación LLM Security - Sesión 3"
type: Opaque
data:
  # PLACEHOLDER - reemplazar con valor real antes de aplicar
  # Valor de ejemplo (NO usar en producción):
  # python3 -c "import secrets; print(secrets.token_hex(32))" | base64
  secret-key: REPLACE_WITH_BASE64_ENCODED_SECRET_KEY

  # PLACEHOLDER - URL de Ollama si se usa autenticación
  # echo -n "http://ollama-service:11434" | base64
  ollama-url: aHR0cDovL29sbGFtYS1zZXJ2aWNlOjExNDM0

---
# Ejemplo de cómo crear el secreto con kubectl directamente (más seguro):
# kubectl create secret generic llm-secrets \
#   --namespace=llm-lab \
#   --from-literal=secret-key=$(python3 -c "import secrets; print(secrets.token_hex(32))") \
#   --from-literal=ollama-url=http://ollama-service:11434

---
# Para producción: usar External Secrets Operator con Google Secret Manager
# Requiere: helm install external-secrets external-secrets/external-secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-secrets-gcp
  namespace: llm-lab
  annotations:
    # Solo aplicar este recurso si External Secrets Operator está instalado
    # kubectl get crd externalsecrets.external-secrets.io
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: llm-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: llm-security-secret-key
        version: latest
    - secretKey: ollama-url
      remoteRef:
        key: llm-ollama-url
        version: latest
