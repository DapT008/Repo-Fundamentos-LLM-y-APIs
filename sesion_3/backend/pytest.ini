[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# Markers personalizados
markers =
    slow: tests que tardan más de 1 segundo
    integration: tests de integración (requieren servidor corriendo)
    unit: tests unitarios puros
